steps:
- task: Bash@3
  inputs:
    targetType: 'inline'
    script: |
      rm -r .git
      git init
      git checkout -b master #$(Build.SourceBranchName)
      git config --global user.email "i.papadodimas@linakis.com"
      git config --global user.name "Ilias"
      git add .
      git commit -m "Push New Release $(version)"
      git push -f https://$(username):$(variable_token)@$(url) DevOps #$(Build.SourceBranchName)