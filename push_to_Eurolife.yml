trigger: 
  branches:
    include: 
    - '*'

variables:
  gitUrl: https://$(username):$(gitToken)@github.com/papilias/eurolife.git
  azureUrl: https://$(username):$(azureToken)@dev.azure.com/LinakisDigitalTeam/Eurolife/_git/$(repoFolder)
  username: ipDevOps
  gitToken: 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
  azureToken: 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
  version: $(Build.BuildNumber)
  branch: $(Build.SourceBranchName)
  repoFolder: Sitecore

pool:
  vmImage: ubuntu-latest
# pool:
#   name: 'DevOps'
#   demands:
#       - agent.name -equals InternalIT-Agent

steps:
- checkout: none
- task: Bash@3
  inputs:
    targetType: 'inline'
    script: |
      git clone --branch $(branch) https://$(username):$(azureToken)@dev.azure.com/LinakisDigitalTeam/Eurolife/_git/$(repoFolder) --single-branch
      cd $(repoFolder)
      git config --global user.email "i.papadodimas@linakis.com"
      git config --global user.name "Ilias"
      git add .
      git commit -m "Push version $(version)"
      git remote add eurolife https://$(username):$(gitToken)@github.com/papilias/eurolife.git
      git push -u eurolife $(branch)