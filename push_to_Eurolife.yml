trigger: 
  branches:
    include: 
    - '*'

variables:
  url: github.com/ipDevOps/eurolife.git
  username: ipDevOps
  variable_token: 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
  version: $(Build.BuildNumber)

pool:
  vmImage: ubuntu-latest
# pool:
#   name: 'DevOps'
