        <p dir="ltr" style="margin-top: 0pt; margin-bottom: 0pt;"><span style="background-color: transparent; text-decoration: none; font-size: 12px; color: #000000;">Η <a href=" https://training.eurolife.gr">Πλατφόρμα Ψηφιακής Εκπαίδευσης</a> (e-learning) συνεργατών της Eurolife ERB</span><span style="background-color: transparent; text-decoration: none; color: #000000;"> αποτελεί ένα απόλυτα σύγχρονο εργαλείο μάθησης, που διευρύνει τις πρωτοβουλίες της εταιρείας μας για δημιουργία νέων και ευέλικτων εργαλείων δουλειάς.&nbsp;</span></p>
        <span style="background-color: transparent; text-decoration: none; font-size: 12px; color: #000000;">Στην πλατφόρμα συγκεντρώνεται όλο το υλικό εκπαίδευσης ανά μήνα και ανά εβδομάδα, ενώ οι ενδιαφερόμενοι μπορούν να συνδεθούν και να δηλώσουν συμμετοχή με το πάτημα ενός κουμπιού, για όποιο πρόγραμμα, σεμινάριο ή και ημερίδα τους ενδιαφέρει. Δημιουργούμε νέες δυνατότητες, με χρήση νέων δυναμικών εργαλείων.</span>
