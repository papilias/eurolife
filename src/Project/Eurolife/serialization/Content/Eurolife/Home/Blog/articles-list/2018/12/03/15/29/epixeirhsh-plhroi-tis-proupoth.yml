      Value: |
        <p>Η <strong>υγεία και η ασφάλεια στην εργασία</strong> είναι πολύ σημαντική και μας αφορά όλους. Εκτός από τις υποχρεώσεις του εργοδότη και οι εργαζόμενοι με τη σειρά τους οφείλουν να είναι ενημερωμένοι, να χρησιμοποιούν σωστά τον εξοπλισμό τους, να ενημερώνουν τον εργοδότη για καταστάσεις που παρουσιάζουν άμεσο κίνδυνο και να βοηθούν στην υλοποίηση των απαιτήσεων που προάγουν την υγεία και την ασφάλεια στην εργασία.</p><p>Απαντήστε στις ερωτήσεις του quiz για να δείτε κατά πόσο η εταιρεία στην οποία εργάζεστε προάγει την υγεία και την ασφάλεια στην εργασία:</p><p><iframe data-rid-id="141673" width="600" height="600" frameborder="0" src="https://www.riddle.com/showcase/147730/quiz" title="List - Η επιχείρηση στην οποία εργάζεστε πληροί τις προϋποθέσεις για την υγεία και την ασφάλεια στην εργασία;"></iframe></p>
