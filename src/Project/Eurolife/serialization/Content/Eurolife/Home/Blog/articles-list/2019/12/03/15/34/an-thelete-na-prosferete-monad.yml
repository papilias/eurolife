    - ID: "751cc2e2-f3d2-4896-94b5-ed8174395942"
      Hint: Main content
      Value: |
        Είχατε από παλιά &nbsp;το «μικρόβιο» του ντιζάινερ αλλά δεν βρέθηκε ποτέ η κατάλληλη ευκαιρία να το αναδείξετε; Τώρα μπορείτε να σχεδιάσετε το δικό σας ζευγάρι γυαλιά ηλίου και να κυκλοφορείτε γνωρίζοντας καλά ότι όμοιό του δεν υπάρχει πουθενά στον κόσμο!<p>Στο site <a href="www.canvaseyewear.com" target="_blank">www.canvaseyewear.com</a> μπορείτε να σχεδιάσετε τα γυαλιά σας όπως ακριβώς τα &nbsp;θέλατε αλλά δεν τα βρίσκατε μέχρι στιγμής στην αγορά. Ένα ζευγάρι με το ίδιο σχέδιο που έχει το αγαπημένο σας πουκάμισο ή με μια ζωγραφιά του παιδιού σας να στολίζει τους βραχίονες!&nbsp;</p><p>Η ιδέα των δημιουργών του site ήταν ιδιαίτερα πρωτότυπη, αφού πριν το canvaseyewear.com υπήρχαν αντίστοιχα online καταστήματα στα οποία όμως μπορούσες απλά να πειραματιστείς με διάφορα «έτοιμα» σχέδια και να καταλήξεις στο συνδυασμό που προτιμάς. Η διαφορά είναι ότι εδώ μπορεί ο καθένας να «ανεβάσει» ένα δικό του σχέδιο το οποίο θα τυπωθεί πάνω στο σκελετό. Στη συνέχεια, επιλέγει το χρώμα των φακών που ταιριάζει περισσότερο και… σε λίγες μέρες τα γυαλιά φτάνουν στην πόρτα του!</p><p>Η επιχείρηση στήθηκε με τη μέθοδο του crowdfunding, δηλαδή το κεφάλαιο συγκεντρώθηκε από χιλιάδες διαφορετικά άτομα σε δεκάδες χώρες που πίστεψαν στο εγχείρημα και τελικά η χρηματοδότηση ξεπέρασε κατά πολύ το ποσό που είχαν προϋπολογίσει οι δημιουργοί του.&nbsp;</p>Τα γυαλιά κατασκευάζονται και αποστέλλονται μια εβδομάδα μετά την παραγγελία σας, οπότε αν τα θέλετε για δώρο ίσα που προλαβαίνετε την Πρωτοχρονιά!
