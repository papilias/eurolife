        <p>Ο λόγος για την ευτυχία! Γιατί κανείς όμως δεν μας είπε μέχρι σήμερα πόσο εύκολο είναι να τη νιώσει κανείς, όποτε θέλει, εκεί που κάθεται, χωρίς καμία προσπάθεια; Σύμφωνα με τους επιστήμονες, για να νιώσουμε ευτυχισμένοι αρκεί να κάνουμε μια πολύ μικρή κίνηση, χρησιμοποιώντας ελάχιστους μυς του σώματός μας (hint: Βρίσκονται στο πρόσωπό μας). Περισσότερα στο βίντεο που ακολουθεί:</p><p></p><iframe width="560" height="315" src="//www.youtube.com/embed/5cysPPnZEhM" frameborder="0"></iframe>
