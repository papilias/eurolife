    - ID: "9fb7209f-e455-4463-91ba-1216d326dbfc"
      Hint: Teaser
      Value: Πάντα διαφωνούμε όταν στηνόμαστε μπροστά στην τηλεόραση. Εκείνη, από μικρή, προτιμούσε τα δακρύβρεχτα. Εμένα, μου έφερναν ναυτία. Πάντα προτιμούσα την περιπέτεια. Πιστολίδι, ληστές, κυνηγητά... Τον Μπελμοντό να γυρίζει τις επικίνδυνες σκηνές χωρίς κασκαντέρ... Μου αρέσει το αίμα να τρέχει στην τηλεόραση. Πρέπει να το δω, μου φαίνεται, με κανέναν καλό ψυχίατρο...
