        Πώς γίνεται ένα τόσο δα πλασματάκι να προκαλεί τόσο έντονα συναισθήματα; Η επιστήμη κατάφερε να αποκρυπτογραφήσει το λόγο που μας κάνει να «λιώνουμε» μπροστά σε ένα στρουμπουλό μωρό!Έχετε αναρωτηθεί ποτέ τι είναι αυτό που μας κάνει να νιώθουμε τα πιο τρυφερά συναισθήματα στη θέα και μόνο ενός μωρού –ενός οποιουδήποτε μωρού ακόμα κι αν δεν είναι το δικό μας, της αδερφής μας ή του φίλου μας;Δεν είναι επειδή ξυπνούν το μητρικό ή το πατρικό μας ένστικτο, ούτε επειδή είναι μικρούλικα και χαριτωμένα. &nbsp;Δεν είναι αντίδραση μόνο των γυναικών, δεν &nbsp;οφείλεται στο βιολογικό ρολόϊ τους, ούτε είναι ορμονικό.<p>Κυρίως, δεν είναι κάτι που μπορούμε να ελέγξουμε, γιατί η αντίδρασή μας ορίζεται από διεργασίες που λαμβάνουν χώρα στα πιο αρχέγονα σημεία του εγκεφάλου μας, όπως αποκαλύπτει αυτό το βίντεο:</p><p></p><iframe width="560" height="315" src="//www.youtube.com/embed/2rALJido4iI" frameborder="0"></iframe>
