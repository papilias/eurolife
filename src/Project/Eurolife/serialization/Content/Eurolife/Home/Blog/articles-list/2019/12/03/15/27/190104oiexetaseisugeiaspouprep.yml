      Value: O προληπτικός έλεγχος, ακόμα και στην νεαρή ηλικία των 30, θεωρείται απαραίτητος. Κάποιες γυναίκες το αποφεύγουν λόγω φόβου, άλλες γιατί θεωρούν ότι δεν τις αφορά, όμως η καλή υγεία είναι το «όπλο» μας για να αντιμετωπίζουμε τις αυξημένες απαιτήσεις της καθημερινότητάς μας.
