        <div style="text-align: justify;">Τα τελευταία χρόνια, όλο και πιο συχνά, γίνεται λόγος για τη σχέση που έχει η ψυχολογική κατάσταση στην οποία βρισκόμαστε με τα προβλήματα υγείας που πιθανώς αντιμετωπίζουμε. Είναι, λοιπόν, η ευτυχία το κλειδί για καλή υγεία; Και πώς μπορούμε να πετύχουμε τον τέλειο συνδυασμό;</div>
