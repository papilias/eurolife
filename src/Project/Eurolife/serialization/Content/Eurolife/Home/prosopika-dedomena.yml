        <p style="text-align: justify;"><span style="color: #444444;">&Omicron;&iota; &epsilon;&tau;&alpha;&iota;&rho;&epsilon;ί&epsilon;&sigmaf; Eurolife ERB &Alpha;&nu;ώ&nu;&upsilon;&mu;&omicron;&sigmaf; &Epsilon;&tau;&alpha;&iota;&rho;&epsilon;ί&alpha; &Alpha;&sigma;&phi;&alpha;&lambda;ί&sigma;&epsilon;&omega;&nu; &Zeta;&omega;ή&sigmaf; &kappa;&alpha;&iota; Eurolife ERB &Alpha;&nu;ώ&nu;&upsilon;&mu;&omicron;&sigmaf; &Epsilon;&tau;&alpha;&iota;&rho;&epsilon;ί&alpha; &Gamma;&epsilon;&nu;&iota;&kappa;ώ&nu; &Alpha;&sigma;&phi;&alpha;&lambda;ί&sigma;&epsilon;&omega;&nu; (έ&kappa;&alpha;&sigma;&tau;&eta; &epsilon;&phi;&epsilon;&xi;ή&sigmaf; &alpha;&nu;&alpha;&phi;&epsilon;&rho;ό&mu;&epsilon;&nu;&eta; &omega;&sigmaf; &eta; <strong>&laquo;&Epsilon;&tau;&alpha;&iota;&rho;&epsilon;ί&alpha;&raquo;</strong> &raquo; ή &omicron; <strong>&laquo;&Upsilon;&pi;&epsilon;ύ&theta;&upsilon;&nu;&omicron;&sigmaf; &Epsilon;&pi;&epsilon;&xi;&epsilon;&rho;&gamma;&alpha;&sigma;ί&alpha;&sigmaf;&raquo;</strong>),&nbsp; &omicron;&iota; &omicron;&pi;&omicron;ί&epsilon;&sigmaf; &epsilon;&delta;&rho;&epsilon;ύ&omicron;&upsilon;&nu; &sigma;&tau;&eta;&nu; &omicron;&delta;ό &Pi;&alpha;&nu;&epsilon;&pi;&iota;&sigma;&tau;&eta;&mu;ί&omicron;&upsilon; 33-35 &amp; &Kappa;&omicron;&rho;&alpha;ή, 10564, &Alpha;&theta;ή&nu;&alpha; &kappa;&alpha;&iota; έ&chi;&omicron;&upsilon;&nu; &sigma;&tau;&omicron;&iota;&chi;&epsilon;ί&alpha; &epsilon;&pi;&iota;&kappa;&omicron;&iota;&nu;&omega;&nu;ί&alpha;&sigmaf; &tau;&eta;&lambda;:</span><strong><span style="color: #444444;"> </span></strong><span style="color: #444444;">210 9303800 &kappa;&alpha;&iota; e-mail: </span><span><a href="mailto:info@eurolife.gr"><span>info@eurolife.gr</span></a></span><span style="color: #444444;">, &theta;&epsilon;&omega;&rho;&omicron;ύ&nu; &tau;&eta;&nu; &pi;&rho;&omicron;&sigma;&tau;&alpha;&sigma;ί&alpha; &tau;&omega;&nu; &delta;&epsilon;&delta;&omicron;&mu;έ&nu;&omega;&nu; &sigma;&alpha;&sigmaf; έ&nu;&alpha; &theta;έ&mu;&alpha; &epsilon;&xi;&alpha;&iota;&rho;&epsilon;&tau;&iota;&kappa;ή&sigmaf; &sigma;&eta;&mu;&alpha;&sigma;ί&alpha;&sigmaf; &kappa;&alpha;&iota; &delta;&epsilon;&sigma;&mu;&epsilon;ύ&omicron;&nu;&tau;&alpha;&iota; &nu;&alpha; &chi;&rho;&eta;&sigma;&iota;&mu;&omicron;&pi;&omicron;&iota;&omicron;ύ&nu; ό&lambda;&alpha; &tau;&alpha; &delta;&iota;&alpha;&theta;έ&sigma;&iota;&mu;&alpha; &mu;έ&sigma;&alpha; &omicron;ύ&tau;&omega;&sigmaf; ώ&sigma;&tau;&epsilon; &nu;&alpha; &delta;&iota;&alpha;&tau;&eta;&rho;&omicron;ύ&nu; &tau;&eta;&nu; &iota;&delta;&iota;&omega;&tau;&iota;&kappa;ό&tau;&eta;&tau;ά &sigma;&alpha;&sigmaf;.</span></p>
        <p style="text-align: justify;"><span style="color: #444444;">H</span><span style="color: #444444;"> &epsilon;&nu;&eta;&mu;έ&rho;&omega;&sigma;&eta; &pi;&omicron;&upsilon; &alpha;&kappa;&omicron;&lambda;&omicron;&upsilon;&theta;&epsilon;ί &gamma;&iota;&alpha; &tau;&eta;&nu; &pi;&rho;&omicron;&sigma;&tau;&alpha;&sigma;ί&alpha; &tau;&omega;&nu; &pi;&rho;&omicron;&sigma;&omega;&pi;&iota;&kappa;ώ&nu; &sigma;&alpha;&sigmaf; &delta;&epsilon;&delta;&omicron;&mu;έ&nu;&omega;&nu; &sigma;ά&sigmaf; &upsilon;&pi;&omicron;&delta;&epsilon;&iota;&kappa;&nu;ύ&epsilon;&iota; &tau;&omicron;&nu; &tau;&rho;ό&pi;&omicron; &mu;&epsilon; &tau;&omicron;&nu; &omicron;&pi;&omicron;ί&omicron; &epsilon;&pi;&epsilon;&xi;&epsilon;&rho;&gamma;&alpha;&zeta;ό&mu;&alpha;&sigma;&tau;&epsilon; &tau;&alpha; &pi;&rho;&omicron;&sigma;&omega;&pi;&iota;&kappa;ά &delta;&epsilon;&delta;&omicron;&mu;έ&nu;&alpha; &tau;&omega;&nu; &pi;&epsilon;&lambda;&alpha;&tau;ώ&nu;, &mu;&alpha;&sigmaf;, &tau;&omega;&nu; &epsilon;&pi;&iota;&sigma;&kappa;&epsilon;&pi;&tau;ώ&nu;/&chi;&rho;&eta;&sigma;&tau;ώ&nu; &tau;&omega;&nu; &eta;&lambda;&epsilon;&kappa;&tau;&rho;&omicron;&nu;&iota;&kappa;ώ&nu; &upsilon;&pi;&eta;&rho;&epsilon;&sigma;&iota;ώ&nu; &mu;&alpha;&sigmaf;, &tau;&omega;&nu; &epsilon;&pi;&iota;&sigma;&kappa;&epsilon;&pi;&tau;ώ&nu; &tau;&omega;&nu; &epsilon;&gamma;&kappa;&alpha;&tau;&alpha;&sigma;&tau;ά&sigma;&epsilon;&omega;&nu; &mu;&alpha;&sigmaf;, &tau;&omega;&nu; &sigma;&upsilon;&nu;&epsilon;&rho;&gamma;&alpha;&tau;ώ&nu; &mu;&alpha;&sigmaf;, &tau;&omega;&nu; &upsilon;&pi;&omicron;&psi;&eta;&phi;ί&omega;&nu; &epsilon;&rho;&gamma;&alpha;&zeta;&omicron;&mu;έ&nu;&omega;&nu; &mu;&alpha;&sigmaf; ,</span><span style="color: #444444;"></span><span style="color: #444444;">&tau;&omega;&nu; &epsilon;&nu; &delta;&upsilon;&nu;ά&mu;&epsilon;&iota; &pi;&epsilon;&lambda;&alpha;&tau;ώ&nu; &mu;&alpha;&sigmaf; ή/&kappa;&alpha;&iota; &tau;&omega;&nu; &tau;&rho;ί&tau;&omega;&nu; &delta;&iota;&kappa;&alpha;&iota;&omicron;ύ&chi;