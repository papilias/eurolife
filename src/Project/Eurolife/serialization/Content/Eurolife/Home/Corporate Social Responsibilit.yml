      Value: +πράττουμε
    - ID: "59b7d0be-39f3-4f45-b645-bde65fa07015"
      Hint: CTA
      Value: |
        <link text="ΔΕΙΤΕ ΤΟ ΒΙΝΤΕΟ" anchor="" linktype="internal" class="" title="" target="_blank" querystring="" id="{A5F4940A-1774-4A2D-B5C4-07C728CDF01A}" />
    - ID: "5c95201b-69ed-40ae-abda-9eb83141d8e9"
      Hint: Body
      Value: |
        <p dir="ltr" id="docs-internal-guid-f6d401f1-7fff-b46f-1f00-2d392f47c49d" style="margin-top: 0pt; margin-bottom: 0pt;"><span style="background-color: transparent; text-decoration: none; color: #000000;">Όλα τα χρόνια παρουσίας μας στην ελληνική ασφαλιστική αγορά, στεκόμαστε </span><span style="background-color: transparent; text-decoration: none; color: #000000;">αξιόπιστα δίπλα στους ανθρώπους</span><span style="background-color: transparent; text-decoration: none; color: #000000;">, προστατεύοντας τους ίδιους, αλλά και όσους και όσα τους περιβάλλουν. Αυτά που έχτισαν και αυτά που θέλουν να προσφέρουν στην οικογένειά τους, στην επιχείρησή τους και στον ευρύτερο κύκλο τους. Η σχέση μας μαζί τους είναι </span><span style="background-color: transparent; text-decoration: none; color: #000000;">αμφίδρομη</span><span style="background-color: transparent; text-decoration: none; color: #000000;">. </span><span style="background-color: transparent; text-decoration: none; color: #000000;">Συνεργαζόμαστε</span><span style="background-color: transparent; text-decoration: none; color: #000000;">.&nbsp;</span></p>
        <p dir="ltr" style="margin-top: 0pt; margin-bottom: 0pt;"><span style="background-color: transparent; text-decoration: none; color: #000000;">&nbsp;</span></p>
        <p dir="ltr" style="margin-top: 0pt; margin-bottom: 0pt;"><span style="background-color: transparent; text-decoration: none; color: #000000;">Αναγνωρίζοντας την αξία αυτής της σχέσης και εξελίσσοντάς την, πηγαίνουμε ένα βήμα πιο μπροστά από την προστασία. Θέλουμε </span><span style="background-color: transparent; text-decoration: none; color: #000000;">η παρουσία μας στην κοινωνία να έχει ακόμα πιο σημαντικό σκοπό</span><span style="background-color: transparent; text-decoration: none; color: #000000;">.</span></p>
        <p dir="ltr" style="margin-top: 0pt; margin-bottom: 0pt;"><span style="background-color: transparent; text-decoration: none; color: #000000;">Με ουσιαστικές δράσεις και πραγματική συμμετοχή</span><span style="background-color: transparent; text-decoration: none; color: #000000;">.</span></p>
        <br />
        <p dir="ltr" style="margin-top: 0pt; margin-bottom: 0pt;"><span style="background-color: transparent; text-decoration: none; color: #000000;">Γι’ αυτό και έχουμε επενδύσει στο </span><span style="background-color: transparent; text-decoration: none; color: #000000;">+πράττουμε</span><span style="background-color: transparent; text-decoration: none; color: #000000;">, το πρόγραμμα εταιρικής κοινωνικής μας ευθύνης, με το οποίο στόχος μας είναι να δίνουμε σε όλους μια αισιόδοξη προοπτική για το μέλλον τους.</span></p>
        <br />
        <p dir="ltr" style="margin-top: 0pt; margin-bottom: 0pt;"><span style="background-color: transparent; text-decoration: none; color: #000000;">Στο πλαίσιό του, σχεδιάζουμε και υλοποιούμε μια σειρά από πρωτοβουλίες που βοηθούν τους ανθρώπους να βελτιώνουν τη ζωή και την καθημερινότητά τους.</span></p>
        <p dir="ltr" style="margin-top: 0pt; margin-bottom: 0pt;"><span style="background-color: transparent; text-decoration: none; color: #000000;">Είμαστε αισιόδοξοι για όσα μπορούν να καταφέρουν και στόχος μας είναι να τους ενδυναμώνουμε για να το πετύχουν.</span></p>
        <p dir="ltr" style="margin-top: 0pt; margin-bottom: 0pt;"><span style="background-color: transparent; text-decoration: none; color: #000000;">&nbsp;</span></p>
        <p dir="ltr" style="margin-top: 0pt; margin-bottom: 0pt;"><span style="background-color: transparent; text-decoration: none; color: #000000;">Γι’ αυτό και επενδύουμε σε τομείς που αναβαθμίζουν το αύριο για κάθε άνθρωπο.</span></p>
