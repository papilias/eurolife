    - ID: "3a28c78d-3c5e-4d7b-837b-9f511fb70d80"
      Hint: PersonBody
      Value: |
        <article class="leader-cv p-b-64 p-t-64">Ο κ. Σαρρηγεωργίου είναι Πρόεδρος &amp; Διευθύνων 
        Σύμβουλος της Eurolife ERB Ασφαλιστικής. Μετά την ολοκλήρωση της 
        καταστατικής θητείας του ως Πρόεδρος του Διοικητικού Συμβουλίου της 
        Ένωσης Ασφαλιστικών Εταιριών Ελλάδος (2013-2017), σήμερα είναι 
        Αντιπρόεδρος του Διοικητικού Συμβουλίου, μέλος του Advisory Board της 
        Α.Μ. Nomikos Transworld Maritime Agencies S.A και μέλος του Executive 
        Board for Europe, Middle East and Africa του Wharton School, University 
        of Pennsylvania. Είναι επίσης Πρόεδρος του Διοικητικού Συμβουλίου του 
        Wharton Club of Greece, μέλος του Διοικητικού Συμβουλίου και της 
        Εκτελεστικής Επιτροπής του Ιδρύματος Οικονομικών και Βιομηχανικών 
        Ερευνών (ΙΟΒΕ), καθώς και μέλος του Hellenic Advisory Board του South 
        East European Studies at Oxford (SEESOX).
                    
                    <div class="center--920 center"><p>
                        Μεταξύ άλλων Διοικητικών Συμβουλίων, έχει διατελέσει 
        μέλος του Διοικητικού Συμβουλίου της S&amp;B Industrial Minerals 
        Holdings S.A.R.L., της Επιτροπής Κεφαλαιαγοράς και του Ελληνικού 
        Ινστιτούτου Ασφαλιστικών Σπουδών (ΕΙΑΣ).
                    </p>
                    <p>
                        Ο κ. Σαρρηγεωργίου είναι πτυχιούχος MBA Finance του 
        Wharton School of the University of Pennsylvania και κάτοχος MSc και BSc
         Πολιτικού Μηχανικού του Columbia University.
                    </p>
                    <p>
                        Στο παρελθόν έχει εργαστεί σε μεγάλους χρηματοοικονομικούς ομίλους στην Ελλάδα και στις ΗΠΑ.
                    </p>
                </div>
            </article>
